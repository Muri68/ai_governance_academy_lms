{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>
    :root {
        --primary-dark: #0c1e2e;
        --primary-accent: #ad7a49;
        --bg-main: #f5f5f5;
        --bg-card: #ffffff;
        --text-primary: #1a2332;
        --text-secondary: #6b7280;
        --border-color: #e5e7eb;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-pill: 9999px;
    }

    .btn {
        padding: 0px 22px !important;
    }

    .student-layout {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* ===== TOP NAVBAR ===== */
    .student-navbar {
        background: var(--primary-dark);
        padding: 0 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .student-navbar .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: white;
        text-decoration: none;
        font-weight: 700;
        font-size: 1.1rem;
    }

    .student-navbar .nav-brand img {
        height: 36px;
        width: auto;
    }

    .student-navbar .nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .student-navbar .nav-links a {
        color: rgba(255,255,255,0.7);
        text-decoration: none;
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .student-navbar .nav-links a:hover,
    .student-navbar .nav-links a.active {
        color: white;
        background: rgba(255,255,255,0.1);
    }

    .student-navbar .nav-links a i {
        font-size: 0.9rem;
    }

    .nav-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .nav-icon-btn {
        width: 36px; height: 36px;
        border-radius: 50%;
        border: none;
        background: rgba(255,255,255,0.1);
        color: rgba(255,255,255,0.8);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        transition: all 0.2s;
        position: relative;
    }

    .nav-icon-btn:hover { background: rgba(255,255,255,0.2); color: white; }

    .nav-icon-btn .dot {
        position: absolute;
        top: 6px; right: 6px;
        width: 7px; height: 7px;
        background: var(--danger);
        border-radius: 50%;
        border: 2px solid var(--primary-dark);
    }

    .nav-user-menu {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px 4px 4px;
        border-radius: var(--radius-pill);
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid transparent;
        position: relative;
    }

    .nav-user-menu:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }

    .nav-user-avatar {
        width: 32px; height: 32px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--primary-accent);
    }

    .nav-user-avatar-default {
        width: 32px; height: 32px;
        border-radius: 50%;
        background: var(--primary-accent);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
    }

    .nav-user-name { font-size: 0.85rem; font-weight: 600; color: white; }
    .nav-user-chevron { font-size: 0.65rem; color: rgba(255,255,255,0.5); transition: transform 0.2s; }
    .nav-user-chevron.open { transform: rotate(180deg); }

    .nav-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: 260px;
        background: var(--bg-card);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-lg);
        padding: 8px;
        display: none;
        z-index: 200;
    }

    .nav-dropdown.active { display: block; }

    .nav-dropdown-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
    }

    .nav-dropdown-avatar {
        width: 40px; height: 40px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--primary-accent);
    }

    .nav-dropdown-avatar-default {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: var(--primary-accent);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        font-weight: 700;
    }

    .nav-dropdown-name { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
    .nav-dropdown-email { font-size: 0.75rem; color: var(--text-secondary); }

    .nav-dropdown-divider { height: 1px; background: var(--border-color); margin: 6px 0; }

    .nav-dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-primary);
        text-decoration: none;
        transition: all 0.2s;
    }

    .nav-dropdown-item:hover { background: var(--bg-main); }
    .nav-dropdown-item i { font-size: 0.9rem; width: 18px; text-align: center; color: var(--text-secondary); }
    .nav-dropdown-item.logout { color: var(--danger); }
    .nav-dropdown-item.logout:hover { background: rgba(239, 68, 68, 0.08); }
    .nav-dropdown-item.logout i { color: var(--danger); }

    .mobile-menu-toggle {
        display: none;
        background: none;
        border: none;
        color: white;
        font-size: 1.3rem;
        cursor: pointer;
        padding: 4px;
    }

    /* ===== MAIN CONTENT ===== */
    .student-main {
        flex: 1;
        background: var(--bg-main);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
        .student-navbar { padding: 0 16px; }
        .student-navbar .nav-links { display: none; }
        .student-navbar .nav-links.open {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 64px;
            left: 0;
            right: 0;
            background: var(--primary-dark);
            padding: 12px;
            z-index: 150;
        }
        .mobile-menu-toggle { display: block; }
        .nav-user-name { display: none; }
    }
</style>
{% block student_css %}{% endblock %}
{% endblock %}

{% block content %}
<div class="student-layout">

    <!-- Main Content Area -->
    <div class="student-main">
        {% block student_content %}{% endblock %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Mobile menu toggle
        const mobileToggle = document.getElementById('mobileMenuToggle');
        const mobileNav = document.getElementById('mobileNav');
        if (mobileToggle) {
            mobileToggle.addEventListener('click', function() {
                mobileNav.classList.toggle('open');
            });
        }

        // User dropdown
        const userMenu = document.getElementById('userMenu');
        const navDropdown = document.getElementById('navDropdown');
        const navChevron = document.getElementById('navChevron');
        if (userMenu) {
            userMenu.addEventListener('click', function(e) {
                e.stopPropagation();
                navDropdown.classList.toggle('active');
                navChevron.classList.toggle('open');
            });
            document.addEventListener('click', function(e) {
                if (!userMenu.contains(e.target) && !navDropdown.contains(e.target)) {
                    navDropdown.classList.remove('active');
                    navChevron.classList.remove('open');
                }
            });
        }
    });
</script>
{% block student_js %}{% endblock %}
{% endblock %}
